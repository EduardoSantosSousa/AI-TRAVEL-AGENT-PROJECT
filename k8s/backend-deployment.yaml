apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-travel-backend
  labels:
    app: ai-travel-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-travel-backend
  template:
    metadata:
      labels:
        app: ai-travel-backend
    spec:
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/SEU_PROJECT_ID/ai-travel-repo/backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: ai-travel-backend-secret
          readinessProbe:
            httpGet:
              path: /docs
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"