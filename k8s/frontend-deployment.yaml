apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-travel-frontend
  labels:
    app: ai-travel-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-travel-frontend
  template:
    metadata:
      labels:
        app: ai-travel-frontend
    spec:
      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/SEU_PROJECT_ID/ai-travel-repo/frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"